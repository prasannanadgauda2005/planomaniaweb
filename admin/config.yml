backend:
  name: git-gateway
  branch: main

media_folder: "assets/uploads"
public_folder: "/assets/uploads"

collections:
  - name: "site"
    label: "Site Settings"
    files:
      - label: "Global Media"
        name: "global_media"
        file: "content/site.json"
        fields:
          - { label: "Hero video", name: "heroVideo", widget: "file", media_library: { allow_multiple: false } }
          - { label: "Hero poster", name: "heroPoster", widget: "image", required: false }
          - { label: "Logo", name: "logo", widget: "image", required: false }

  - name: "updates"
    label: "Updates"
    files:
      - label: "Updates List"
        name: "updates_list"
        file: "content/updates.json"
        fields:
          - label: "Items"
            name: "items"
            widget: "list"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Date", name: "date", widget: "datetime", format: "YYYY-MM-DD" }
              - { label: "Summary", name: "summary", widget: "text" }
              - { label: "Image", name: "image", widget: "image", required: false }

  - name: "galleries"
    label: "Galleries"
    files:
      - label: "Corporate"
        name: "corporate"
        file: "content/galleries/corporate.json"
        fields:
          - label: "Images"
            name: "images"
            widget: "list"
            fields:
              - { label: "Image", name: "src", widget: "image" }
              - { label: "Alt text", name: "alt", widget: "string" }
      - label: "Social"
        name: "social"
        file: "content/galleries/social.json"
        fields:
          - label: "Images"
            name: "images"
            widget: "list"
            fields:
              - { label: "Image", name: "src", widget: "image" }
              - { label: "Alt text", name: "alt", widget: "string" }
      - label: "Festive"
        name: "festive"
        file: "content/galleries/festive.json"
        fields:
          - label: "Images"
            name: "images"
            widget: "list"
            fields:
              - { label: "Image", name: "src", widget: "image" }
              - { label: "Alt text", name: "alt", widget: "string" }
      - label: "Vidhi"
        name: "vidhi"
        file: "content/galleries/vidhi.json"
        fields:
          - label: "Images"
            name: "images"
            widget: "list"
            fields:
              - { label: "Image", name: "src", widget: "image" }
              - { label: "Alt text", name: "alt", widget: "string" }
